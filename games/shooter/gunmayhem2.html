<html lang="en"><head><base target="_blank">


    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIGHTLY</title>
</head>
<body>
    <div id="container"><ruffle-player style="width: 100vw; height: 100vh;"></ruffle-player></div>
        <style>
            *{
                margin: 0px;
                overflow-x: hidden;
                overflow-y: hidden;
            }
        </style>
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.addEventListener("load", (event) => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("container");
            container.appendChild(player);
            player.load("https://burritoedition.github.io/emu/swf/GunMayhem2.swf");
            player.style.width = "100vw"; 
            player.style.height = "100vh";
        });
        window.RufflePlayer.config = {
    // Options affecting the whole page
    "publicPath": undefined,
    "polyfills": true,

    // Options affecting files only
    "autoplay": "on",
    "unmuteOverlay": "visible",
    "backgroundColor": null,
    "wmode": "window",
    "letterbox": "fullscreen",
    "warnOnUnsupportedContent": false,
    "contextMenu": true,
    "showSwfDownload": false,
    "upgradeToHttps": window.location.protocol === "https:",
    "maxExecutionDuration": {"secs": 15, "nanos": 0},
    "logLevel": "error",
    "base": null,
    "menu": true,
    "salign": "",
    "scale": "showAll",
    "forceScale": false,
    "quality": "high",
    "splashScreen": true,
};
    </script>
    <script src="https://burritoedition.github.io/emu/NIGHTLY/ruffle.js"></script>


</body></html>
